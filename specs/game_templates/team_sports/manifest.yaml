game:
  id: ai_team_sports
  name: AI Team Sports Challenge
  version: 2.0.0
  description: Turn-based team sport played as dialogue.

competition:
  teams: 2
  default_round_budget: 30
  wall_clock_timeout_seconds: 900

crew:
  roles:
    - id: trainee
      speak_order: 1
      speaker: true
      required: true
    - id: attacker
      speak_order: 2
      speaker: false
      required: true
    - id: defender
      speak_order: 3
      speaker: false
      required: true
    - id: specialist
      speak_order: 4
      speaker: false
      required: false

referee:
  enabled: true
  role: referee
  response_format: json

resources:
  team_token_budget: 60000
  team_memory_budget: 16000
  max_concurrent_agents: 4

dialogue:
  actions:
    - id: MOVE
    - id: PASS
    - id: DEFEND
    - id: ATTACK
    - id: SHOOT
    - id: SUPPORT
    - id: INTERCEPT
  scoring:
    - id: goal
      kind: event
      event: SHOOT
      points: 3
      probability: 0.4
    - id: attack
      kind: event
      event: ATTACK
      points: 1
      probability: 0.3
  win: highest_score

playground:
  editable:
    - crew_instructions
    - member_instructions
    - selected_skills
    - model_selection
    - model_parameters
    - token_distribution
    - memory_distribution
  locked:
    - rules
    - scoring
    - referee
    - action_schema
    - speak_order
